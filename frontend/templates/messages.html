<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trovee — Messages</title>
<link rel="icon" href="/static/img/favicon.ico">
<link rel="manifest" href="/static/manifest.webmanifest">
<meta name="theme-color" content="#06080D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trovee">
<link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="/static/css/trovee.css">
<style>
  .chat-shell { display: flex; flex-direction: column; height: calc(100dvh - 140px); }
  .chat-scroll { flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 10px; }
  .bubble-row { display: flex; }
  .bubble-row.mine { justify-content: flex-end; }
  .bubble {
    max-width: 78%;
    padding: 10px 13px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.45;
    word-wrap: break-word;
    white-space: pre-wrap;
  }
  .bubble-row.theirs .bubble {
    background: var(--surface);
    border: 1px solid var(--line);
    border-bottom-left-radius: 4px;
    color: var(--paper);
  }
  .bubble-row.mine .bubble {
    background: var(--accent);
    color: #08110d;
    border-bottom-right-radius: 4px;
  }
  .bubble-time {
    font-size: 10.5px;
    color: var(--slate-soft);
    margin-top: 3px;
    padding: 0 4px;
  }
  .bubble-row.mine .bubble-time { text-align: right; }
  .chat-input-bar {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--line);
    background: rgba(6, 8, 13, 0.62);
  }
  #chat-text {
    flex: 1;
    background: var(--ink-soft);
    border: 1px solid var(--line-strong);
    border-radius: 20px;
    padding: 11px 16px;
    color: var(--paper);
    font-size: 14.5px;
    font-family: var(--font-body);
    resize: none;
    max-height: 100px;
  }
  #chat-text:focus { border-color: var(--accent); }
  .send-fab {
    width: 42px; height: 42px;
    border-radius: 50%;
    background: var(--accent);
    color: #08110d;
    border: none;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .send-fab:disabled { opacity: 0.5; cursor: default; }
  .chat-empty { margin: auto; text-align: center; color: var(--slate-soft); font-size: 13.5px; }

  .back-btn {
    display: none;
    align-items: center;
    justify-content: center;
    width: 34px; height: 34px;
    border-radius: 50%;
    background: transparent;
    border: none;
    color: var(--paper);
    font-size: 16px;
    cursor: pointer;
    margin-right: 6px;
  }
  .back-btn.visible { display: flex; }

  .inbox-list { overflow-y: auto; padding: 6px 4px; }
  .inbox-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 16px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
  }
  .inbox-row:active { background: var(--surface); }
  .inbox-avatar {
    width: 42px; height: 42px;
    border-radius: 50%;
    background: var(--surface);
    border: 1px solid var(--line-strong);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700;
    font-size: 15px;
    color: var(--accent);
    flex-shrink: 0;
  }
  .inbox-main { flex: 1; min-width: 0; }
  .inbox-name-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .inbox-name { font-weight: 600; font-size: 14.5px; }
  .inbox-time { font-size: 11px; color: var(--slate-soft); flex-shrink: 0; }
  .inbox-preview {
    font-size: 13px; color: var(--slate-soft);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    margin-top: 2px;
  }
  .inbox-badge {
    background: var(--accent);
    color: #08110d;
    font-size: 11px;
    font-weight: 700;
    border-radius: 999px;
    padding: 2px 7px;
    flex-shrink: 0;
  }

  .balance-bar {
    display: none;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
  }
  .balance-bar.visible { display: flex; }
  .balance-bar-label { font-size: 11.5px; color: var(--slate-soft); }
  .balance-bar-amount { font-family: var(--font-mono); font-weight: 700; font-size: 15px; color: var(--paper); }
  .balance-edit-btn {
    background: var(--ink-soft);
    border: 1px solid var(--line-strong);
    color: var(--accent);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
  }
  .balance-edit-form {
    display: none;
    gap: 8px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
    align-items: center;
    flex-wrap: wrap;
  }
  .balance-edit-form.visible { display: flex; }
  .balance-edit-form select, .balance-edit-form input {
    background: var(--ink-soft);
    border: 1px solid var(--line-strong);
    border-radius: 8px;
    padding: 7px 10px;
    color: var(--paper);
    font-size: 13px;
    outline: none;
  }
  .balance-edit-form input { width: 110px; }
  .balance-edit-form button {
    padding: 7px 12px;
    border-radius: 8px;
    border: none;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
  }
  .balance-save-btn { background: var(--accent); color: #08110d; }
  .balance-cancel-btn { background: var(--ink-soft); color: var(--slate-soft); border: 1px solid var(--line-strong) !important; }
</style>
</head>
<body>
<div class="app-shell">
  <div class="top-bar">
    <button class="back-btn" id="back-btn"><i class="fas fa-arrow-left"></i></button>
    <h1 class="page-title" id="chat-title">Messages</h1>
    <span></span>
  </div>

  <div class="chat-shell" id="inbox-view" style="display:none;">
    <div class="inbox-list" id="inbox-list"></div>
  </div>

  <div class="chat-shell" id="thread-view">
    <div class="balance-bar" id="balance-bar">
      <div>
        <div class="balance-bar-label">Balance</div>
        <div class="balance-bar-amount" id="balance-amount">—</div>
      </div>
      <button class="balance-edit-btn" id="balance-edit-toggle">Edit</button>
    </div>
    <div class="balance-edit-form" id="balance-edit-form">
      <select id="balance-mode">
        <option value="set">Set to</option>
        <option value="adjust">Add</option>
        <option value="adjust-sub">Subtract</option>
      </select>
      <input type="number" id="balance-amount-input" placeholder="0.00" step="0.01" min="0">
      <button class="balance-save-btn" id="balance-save-btn">Save</button>
      <button class="balance-cancel-btn" id="balance-cancel-btn">Cancel</button>
    </div>
    <div class="chat-scroll" id="chat-scroll">
      <div class="chat-empty" id="chat-empty">Loading conversation…</div>
    </div>
    <div class="chat-input-bar">
      <textarea id="chat-text" rows="1" placeholder="Type a message…"></textarea>
      <button class="send-fab" id="chat-send"><i class="fas fa-paper-plane"></i></button>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="/dashboard" class="nav-item">
      <i class="fas fa-home"></i>
      <span>Home</span>
    </a>
    <a href="/trading" class="nav-item">
      <i class="fas fa-chart-line"></i>
      <span>Trade</span>
    </a>
    <a href="/shares" class="nav-item">
      <i class="fas fa-landmark"></i>
      <span>Shares</span>
    </a>
    <a href="/deposit" class="nav-item">
      <i class="fas fa-coins"></i>
      <span>Deposit</span>
    </a>
    <a href="/withdraw" class="nav-item">
      <i class="fas fa-arrow-up"></i>
      <span>Withdraw</span>
    </a>
    <a href="/support" class="nav-item">
      <i class="fas fa-headset"></i>
      <span>Support</span>
    </a>
    <a href="/messages" class="nav-item active">
      <i class="fas fa-comment-dots"></i>
      <span>Messages</span>
    </a>
  </nav>
</div>

<script src="/static/js/trovee.js"></script>
<script>
  Trovee.requireAuth();

  // role: "user" -> classic single thread with "Support".
  // role: "agent" -> inbox of every assigned user; opening one shows that thread.
  let role = null;
  let mySender = "user";
  let openTargetId = null; // set when an agent has opened a specific conversation
  let currentBalanceCents = null;
  let currentCurrency = "USD";
  let pollTimer = null;

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function timeAgo(iso) {
    if (!iso) return "";
    const d = new Date(iso.replace(" ", "T") + "Z");
    const diffMs = Date.now() - d.getTime();
    const mins = Math.floor(diffMs / 60000);
    if (mins < 1) return "now";
    if (mins < 60) return `${mins}m`;
    const hrs = Math.floor(mins / 60);
    if (hrs < 24) return `${hrs}h`;
    return `${Math.floor(hrs / 24)}d`;
  }

  function showInbox() {
    openTargetId = null;
    document.getElementById("inbox-view").style.display = "flex";
    document.getElementById("thread-view").style.display = "none";
    document.getElementById("back-btn").classList.remove("visible");
    document.getElementById("chat-title").textContent = "Messages";
    document.getElementById("balance-bar").classList.remove("visible");
    document.getElementById("balance-edit-form").classList.remove("visible");
  }

  function showThread(title) {
    document.getElementById("inbox-view").style.display = "none";
    document.getElementById("thread-view").style.display = "flex";
    document.getElementById("back-btn").classList.toggle("visible", role === "agent");
    document.getElementById("chat-title").textContent = title;
    document.getElementById("balance-edit-form").classList.remove("visible");
    document.getElementById("balance-bar").classList.toggle("visible", role === "agent");
  }

  function formatMoney(cents, currency) {
    if (cents === null || cents === undefined) return "—";
    return `${currency || 'USD'} ${(cents / 100).toFixed(2)}`;
  }

  function renderInbox(conversations) {
    const list = document.getElementById("inbox-list");
    if (!conversations.length) {
      list.innerHTML = '<div class="chat-empty" style="margin-top:40px;">No conversations assigned yet.</div>';
      return;
    }
    const sorted = [...conversations].sort((a, b) => {
      if (!a.last_message_at) return 1;
      if (!b.last_message_at) return -1;
      return new Date(b.last_message_at) - new Date(a.last_message_at);
    });
    list.innerHTML = sorted.map(c => `
      <div class="inbox-row" onclick="openThread(${c.target_user_id}, '${escapeHtml(c.username).replace(/'/g, "\\'")}')">
        <div class="inbox-avatar">${escapeHtml(c.username.charAt(0).toUpperCase())}</div>
        <div class="inbox-main">
          <div class="inbox-name-row">
            <span class="inbox-name">${escapeHtml(c.username)}</span>
            <span class="inbox-time">${timeAgo(c.last_message_at)}</span>
          </div>
          <div class="inbox-preview">${c.last_message ? escapeHtml(c.last_message) : 'No messages yet'}</div>
        </div>
        ${c.unread_count > 0 ? `<span class="inbox-badge">${c.unread_count}</span>` : ''}
      </div>
    `).join("");
  }

  function renderMessages(data) {
    mySender = data.mode === "support" ? "support" : "user";

    if (role === "agent" && "target_balance_usd_cents" in data) {
      currentBalanceCents = data.target_balance_usd_cents;
      currentCurrency = data.target_currency_code || "USD";
      document.getElementById("balance-amount").textContent = formatMoney(currentBalanceCents, currentCurrency);
    }

    const scroll = document.getElementById("chat-scroll");
    const wasNearBottom = scroll.scrollHeight - scroll.scrollTop - scroll.clientHeight < 80;

    if (!data.messages.length) {
      scroll.innerHTML = '<div class="chat-empty">No messages yet. Say hello!</div>';
      return;
    }

    scroll.innerHTML = data.messages.map(m => {
      const mine = m.sender === mySender;
      const time = new Date(m.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      return `
        <div class="bubble-row ${mine ? 'mine' : 'theirs'}">
          <div>
            <div class="bubble">${escapeHtml(m.body)}</div>
            <div class="bubble-time">${time}</div>
          </div>
        </div>
      `;
    }).join("");

    if (wasNearBottom) scroll.scrollTop = scroll.scrollHeight;
  }

  async function loadThread(scrollToBottom) {
    try {
      const path = role === "agent" ? `/api/messages/thread/${openTargetId}` : "/api/messages";
      const data = await Trovee.api(path);
      renderMessages(data);
      if (scrollToBottom) {
        const scroll = document.getElementById("chat-scroll");
        scroll.scrollTop = scroll.scrollHeight;
      }
    } catch (err) {
      if (err.status === 401) { Trovee.logout(); return; }
      document.getElementById("chat-empty").textContent = "Couldn't load messages.";
    }
  }

  window.openThread = function (targetId, username) {
    openTargetId = targetId;
    document.getElementById("chat-scroll").innerHTML = '<div class="chat-empty">Loading conversation…</div>';
    showThread(username);
    loadThread(true);
    restartPolling();
  };

  document.getElementById("back-btn").addEventListener("click", () => {
    stopPolling();
    showInbox();
    refreshInbox();
    startInboxPolling();
  });

  async function refreshInbox() {
    try {
      const data = await Trovee.api("/api/messages/context");
      renderInbox(data.conversations || []);
    } catch (err) {
      if (err.status === 401) { Trovee.logout(); }
    }
  }

  async function sendMessage() {
    const textarea = document.getElementById("chat-text");
    const btn = document.getElementById("chat-send");
    const body = textarea.value.trim();
    if (!body) return;

    btn.disabled = true;
    try {
      const path = role === "agent" ? `/api/messages/thread/${openTargetId}` : "/api/messages";
      await Trovee.api(path, { method: "POST", body: { message: body } });
      textarea.value = "";
      textarea.style.height = "auto";
      await loadThread(true);
    } catch (err) {
      Trovee.showToast(err.message, "error");
    } finally {
      btn.disabled = false;
    }
  }

  document.getElementById("chat-send").addEventListener("click", sendMessage);
  document.getElementById("chat-text").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
  document.getElementById("chat-text").addEventListener("input", function () {
    this.style.height = "auto";
    this.style.height = Math.min(this.scrollHeight, 100) + "px";
  });

  document.getElementById("balance-edit-toggle").addEventListener("click", () => {
    const form = document.getElementById("balance-edit-form");
    form.classList.toggle("visible");
    if (form.classList.contains("visible")) {
      document.getElementById("balance-mode").value = "set";
      document.getElementById("balance-amount-input").value = currentBalanceCents !== null
        ? (currentBalanceCents / 100).toFixed(2) : "";
      document.getElementById("balance-amount-input").focus();
    }
  });

  document.getElementById("balance-cancel-btn").addEventListener("click", () => {
    document.getElementById("balance-edit-form").classList.remove("visible");
  });

  document.getElementById("balance-save-btn").addEventListener("click", async () => {
    const modeSel = document.getElementById("balance-mode").value;
    const raw = parseFloat(document.getElementById("balance-amount-input").value);
    if (isNaN(raw) || raw < 0) {
      Trovee.showToast("Enter a valid amount.", "error");
      return;
    }
    const cents = Math.round(raw * 100);
    const mode = modeSel === "adjust-sub" ? "adjust" : (modeSel === "adjust" ? "adjust" : "set");
    const amount_usd_cents = modeSel === "adjust-sub" ? -cents : cents;

    const btn = document.getElementById("balance-save-btn");
    btn.disabled = true;
    try {
      const res = await Trovee.api(`/api/messages/thread/${openTargetId}/balance`, {
        method: "POST",
        body: { amount_usd_cents, mode },
      });
      currentBalanceCents = res.new_balance_usd_cents;
      document.getElementById("balance-amount").textContent = formatMoney(currentBalanceCents, currentCurrency);
      document.getElementById("balance-edit-form").classList.remove("visible");
      Trovee.showToast("Balance updated.");
    } catch (err) {
      Trovee.showToast(err.message, "error");
    } finally {
      btn.disabled = false;
    }
  });

  function stopPolling() {
    clearInterval(pollTimer);
    pollTimer = null;
  }
  function restartPolling() {
    stopPolling();
    pollTimer = setInterval(() => loadThread(false), 5000);
  }
  function startInboxPolling() {
    stopPolling();
    pollTimer = setInterval(refreshInbox, 5000);
  }

  async function init() {
    try {
      const ctx = await Trovee.api("/api/messages/context");
      role = ctx.role;
      if (role === "agent") {
        renderInbox(ctx.conversations || []);
        showInbox();
        startInboxPolling();
      } else {
        showThread("Support");
        loadThread(true);
        restartPolling();
      }
    } catch (err) {
      if (err.status === 401) { Trovee.logout(); return; }
      showThread("Support");
      loadThread(true);
      restartPolling();
    }
  }

  init();
  window.addEventListener("beforeunload", () => stopPolling());
</script>
</body>
</html>
